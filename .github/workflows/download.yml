name: TikTok Downloader

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  download:
    if: startsWith(github.event.issue.title, 'TIKTOK:')
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install tools
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install --upgrade yt-dlp curl_cffi
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg

      - name: Get URL from title
        id: extract
        run: |
          TITLE="${{ github.event.issue.title }}"
          URL="${TITLE#TIKTOK: }"
          echo "url=$URL" >> $GITHUB_OUTPUT

      - name: Download
        env:
          TIKTOK_URL: ${{ steps.extract.outputs.url }}
          TIKTOK_COOKIES: ${{ secrets.TIKTOK_COOKIES }}
        run: |
          mkdir -p output
          echo "$TIKTOK_COOKIES" > cookies.txt
          yt-dlp \
            --no-playlist \
            --cookies cookies.txt \
            --impersonate chrome \
            --merge-output-format mp4 \
            --retries 5 \
            -o "output/tiktok.%(ext)s" \
            "$TIKTOK_URL"
          rm cookies.txt
          ls -la output/

      - name: Upload Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: tiktok-${{ github.run_number }}
          files: output/tiktok.mp4
          make_latest: true
          fail_on_unmatched_files: false

      - name: Save URL
        if: success()
        run: |
          URL="https://github.com/${{ github.repository }}/releases/download/tiktok-${{ github.run_number }}/tiktok.mp4"
          echo "$URL" > latest.txt
          git config user.name "bot"
          git config user.email "bot@bot.com"
          git add latest.txt
          git commit -m "update" || echo "no change"
          git push

      - name: Close issue
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed'
            });
