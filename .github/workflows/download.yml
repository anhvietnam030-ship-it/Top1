name: TikTok Downloader

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'Link TikTok'
        required: true
        type: string

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright
        run: |
          npm init -y
          npm i playwright
          npx playwright install chromium --with-deps

      - name: Download video
        env:
          TIKTOK_URL: ${{ github.event.inputs.url }}
        run: node download.js

      - name: Upload video
        uses: actions/upload-artifact@v4
        with:
          name: tiktok-video
          path: output/
          retention-days: 7
