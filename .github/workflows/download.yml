name: TikTok Downloader

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  download:
    if: startsWith(github.event.issue.title, 'TIKTOK:')
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright
        run: |
          npm init -y
          npm i playwright
          npx playwright install chromium --with-deps

      - name: Get URL from title
        id: extract
        run: |
          TITLE="${{ github.event.issue.title }}"
          URL="${TITLE#TIKTOK: }"
          URL="${URL/www.tiktok.com/m.tiktok.com}"
          echo "url=$URL" >> $GITHUB_OUTPUT

      - name: Download video
        env:
          TIKTOK_URL: ${{ steps.extract.outputs.url }}
        run: node download.js

      - name: Upload Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: tiktok-${{ github.run_number }}
          files: output/tiktok.mp4
          make_latest: true

      - name: Save URL
        if: success()
        run: |
          URL="https://github.com/${{ github.repository }}/releases/download/tiktok-${{ github.run_number }}/tiktok.mp4"
          echo "$URL" > latest.txt
          git config user.name "bot"
          git config user.email "bot@bot.com"
          git add latest.txt
          git commit -m "update" || echo "no change"
          git push

      - name: Close issue
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed'
            });
