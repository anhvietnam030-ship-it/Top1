name: TikTok Downloader

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'Link TikTok'
        required: true
        type: string

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Install yt-dlp
        run: |
          python3 -m pip install --upgrade yt-dlp

      - name: Download video
        env:
          TIKTOK_URL: ${{ github.event.inputs.url }}
        run: |
          mkdir -p output
          yt-dlp \
            --no-playlist \
            --merge-output-format mp4 \
            -o "output/tiktok.%(ext)s" \
            "$TIKTOK_URL"
          echo "---"
          ls -la output/

      - name: Upload video
        uses: actions/upload-artifact@v4
        with:
          name: tiktok-video
          path: output/
