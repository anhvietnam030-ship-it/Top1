name: TikTok Downloader

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'Link TikTok'
        required: true
        type: string

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install yt-dlp + curl_cffi + ffmpeg
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install --upgrade yt-dlp curl_cffi
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg

      - name: Download video
        env:
          TIKTOK_URL: ${{ github.event.inputs.url }}
        run: |
          mkdir -p output
          yt-dlp \
            --no-playlist \
            --impersonate chrome \
            --merge-output-format mp4 \
            --no-warnings \
            --retries 5 \
            --fragment-retries 5 \
            -o "output/tiktok.%(ext)s" \
            "$TIKTOK_URL"
          echo "--- Kết quả ---"
          ls -la output/

      - name: Upload to 0x0.st
        id: upload
        if: success()
        run: |
          FILE=$(ls output/*.mp4 2>/dev/null | head -1)
          if [ -z "$FILE" ]; then
            echo "❌ Không có file mp4 nào"
            exit 1
          fi
          echo "Đang upload: $FILE"
          URL=$(curl -s -F "file=@$FILE" -H "User-Agent: Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS X)" https://0x0.st)
          echo "Link video: $URL"
          if [[ ! "$URL" =~ ^https:// ]]; then
            echo "❌ Upload thất bại: $URL"
            exit 1
          fi
          echo "url=$URL" >> $GITHUB_OUTPUT

      - name: Save URL to repo
        if: success()
        run: |
          echo "${{ steps.upload.outputs.url }}" > latest.txt
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add latest.txt
          git commit -m "Update latest video URL" || echo "No changes"
          git push
