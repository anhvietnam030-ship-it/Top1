name: TikTok Downloader

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'Link TikTok'
        required: true
        type: string

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Install yt-dlp
        run: python3 -m pip install --upgrade yt-dlp

      - name: Download video
        env:
          TIKTOK_URL: ${{ github.event.inputs.url }}
        run: |
          mkdir -p output
          yt-dlp --no-playlist --merge-output-format mp4 \
            -o "output/tiktok.%(ext)s" "$TIKTOK_URL"

      - name: Upload to catbox
        id: upload
        run: |
          FILE=$(ls output/*.mp4 | head -1)
          URL=$(curl -s -F "reqtype=fileupload" -F "fileToUpload=@$FILE" https://catbox.moe/user/api.php)
          echo "Video URL: $URL"
          echo "url=$URL" >> $GITHUB_OUTPUT

      - name: Save URL to repo
        run: |
          echo "${{ steps.upload.outputs.url }}" > latest.txt
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add latest.txt
          git commit -m "Update latest video URL" || echo "No changes"
          git push
