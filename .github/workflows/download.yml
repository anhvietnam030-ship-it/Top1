name: TikTok Downloader

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  download:
    if: startsWith(github.event.issue.title, 'TIKTOK:')
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install yt-dlp + curl_cffi + ffmpeg
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install --upgrade yt-dlp curl_cffi
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg

      - name: Extract URL from issue title
        id: extract
        run: |
          TITLE="${{ github.event.issue.title }}"
          URL="${TITLE#TIKTOK: }"
          echo "Extracted URL: $URL"
          echo "url=$URL" >> $GITHUB_OUTPUT

      - name: Download video
        env:
          TIKTOK_URL: ${{ steps.extract.outputs.url }}
        run: |
          mkdir -p output
          yt-dlp \
            --no-playlist \
            --impersonate chrome \
            --merge-output-format mp4 \
            --no-warnings \
            --retries 5 \
            -o "output/tiktok.%(ext)s" \
            "$TIKTOK_URL"
          ls -la output/

      - name: Upload to GitHub Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: tiktok-${{ github.run_number }}
          name: TikTok ${{ github.run_number }}
          files: output/tiktok.mp4
          token: ${{ secrets.GITHUB_TOKEN }}
          make_latest: true

      - name: Save URL to repo
        if: success()
        run: |
          URL="https://github.com/${{ github.repository }}/releases/download/tiktok-${{ github.run_number }}/tiktok.mp4"
          echo "$URL" > latest.txt
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add latest.txt
          git commit -m "Update latest video URL" || echo "No changes"
          git push

      - name: Close issue
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed'
            });
